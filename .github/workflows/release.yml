# Publie une release GitHub :
# - automatiquement à chaque tag de version poussé (ex. v2.9.0),
# - ou à la main depuis l'onglet Actions > Release > Run workflow, en indiquant la version :
#   le tag est alors créé sur la branche choisie (main par défaut).
# Contenu :
# - notes de version tirées du CHANGELOG (toutes les sections depuis la release précédente)
# - pièces jointes : editeur-lheo-edof.html seul, et un zip pour une utilisation en local
#   (éditeur + mode d'emploi + LISEZMOI.txt)
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version à publier, ex. v2.9.0 (doit avoir sa section dans CHANGELOG.md)'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Préparer le zip et les notes de version
        env:
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Version invalide : $TAG (attendu : vX.Y.Z)"; exit 1; }
          VERSION="${TAG#v}"
          grep -q "^## \[${VERSION}\]" CHANGELOG.md || { echo "::error::Section ## [${VERSION}] absente du CHANGELOG"; exit 1; }

          # Release précédente (tag v* antérieur), pour reprendre toutes les versions intermédiaires du CHANGELOG
          PREV_TAG=$(git describe --tags --abbrev=0 --match 'v*' --exclude "$TAG" HEAD 2>/dev/null || true)
          PREV="${PREV_TAG#v}"
          awk -v v="$VERSION" -v p="$PREV" '
            index($0, "## [" v "]") == 1 { on = 1 }
            p != "" && index($0, "## [" p "]") == 1 { on = 0 }
            on' CHANGELOG.md > notes.md
          {
            echo
            echo '---'
            echo '### 📥 Installation'
            echo "- **En ligne**, sans rien installer : https://ericfalcon.github.io/editeur-LHEO/editeur-lheo-edof.html"
            echo "- **Sur votre ordinateur** : téléchargez \`editeur-lheo-${TAG}.zip\` ci-dessous, dézippez-le et double-cliquez sur \`editeur-lheo-edof.html\` (voir \`LISEZMOI.txt\`)."
            echo
            echo "Détail complet : [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)"
          } >> notes.md

          DIR="editeur-lheo-${TAG}"
          mkdir "$DIR"
          cp editeur-lheo-edof.html guide.html release/LISEZMOI.txt "$DIR/"
          zip -r "${DIR}.zip" "$DIR"

      - name: Créer la release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.version || github.ref_name }}
        run: |
          # Lancement manuel : le tag n'existe pas encore, il est créé sur le commit testé
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            "editeur-lheo-${TAG}.zip" \
            editeur-lheo-edof.html
